name: Auto Release Android APK & AAB

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag (defaults to latest)'
        required: false
        default: 'latest'

permissions:
  contents: write

jobs:
  build-test-release:
    name: Test, Build & Auto-Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore debug keystore
        run: base64 -d debug.keystore.base64 > debug.keystore

      - name: Run unit & Robolectric UI tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --no-daemon
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/SS-Block-Puzzle-debug.apk

      - name: Build Signed Release APK & AAB (when signing secrets are configured)
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          gradle :app:assembleRelease :app:bundleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk release-assets/SS-Block-Puzzle-release.apk
          cp app/build/outputs/bundle/release/app-release.aab release-assets/SS-Block-Puzzle-release.aab

      - name: Clean up temporary keystore files
        if: always()
        run: rm -f my-upload-key.jks debug.keystore

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ss-block-puzzle-builds
          path: release-assets/*

      - name: Determine release tag
        id: tag_meta
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "name=S&S Block Puzzle ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
            echo "name=S&S Block Puzzle (${{ inputs.release_tag }})" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "name=S&S Block Puzzle (Latest Build)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag_meta.outputs.tag }}
          name: ${{ steps.tag_meta.outputs.name }}
          generate_release_notes: true
          make_latest: true
          files: |
            release-assets/*
