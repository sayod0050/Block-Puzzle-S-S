name: Auto Release Android APK & AAB

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag (e.g. v1.1.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-test-release:
    name: Test, Build & Auto-Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK licenses
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(command -v sdkmanager || ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure debug keystore exists
        shell: bash
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run unit & Robolectric UI tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Debug APK
        shell: bash
        run: |
          gradle :app:assembleDebug --no-daemon
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/SS-Block-Puzzle-v1.1.0-debug.apk

      - name: Build Signed Release APK & AAB (when signing secrets are configured)
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            gradle :app:assembleRelease :app:bundleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk release-assets/SS-Block-Puzzle-v1.1.0-release.apk
            cp app/build/outputs/bundle/release/app-release.aab release-assets/SS-Block-Puzzle-v1.1.0-release.aab
          else
            echo "Release signing secrets not set; publishing debug-signed APK only."
          fi

      - name: Clean up temporary keystore files
        if: always()
        shell: bash
        run: rm -f my-upload-key.jks debug.keystore

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ss-block-puzzle-builds
          path: release-assets/*

      - name: Determine release tag
        id: tag_meta
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "name=S&S Block Puzzle ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
            echo "name=S&S Block Puzzle ${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            TAG="v1.1.${{ github.run_number }}"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "name=S&S Block Puzzle ${TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag_meta.outputs.tag }}
          name: ${{ steps.tag_meta.outputs.name }}
          generate_release_notes: true
          make_latest: true
          files: |
            release-assets/*
